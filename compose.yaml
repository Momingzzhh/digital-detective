services:
  detective:
    build: .
    ports:
      - "127.0.0.1:8765:8765"
    env_file: .env
    volumes:
      - detective-data:/app/runtime
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  detective-data:
