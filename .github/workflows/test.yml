name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip check
      - name: CPU-only tests (no model imports or network)
        run: |
          mkdir -p artifacts/research_v2
          python scripts/test_cpu.py --junitxml=artifacts/research_v2/cpu-tests.xml
        env:
          DASHSCOPE_API_KEY: ''
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-test-results
          path: artifacts/research_v2/cpu-tests.xml
