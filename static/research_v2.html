<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>训练材料逐项复核</title>
<style>body{font:16px/1.7 system-ui;background:#f5f6f3;color:#24352e;margin:0}main{max-width:1100px;margin:auto;padding:28px}section{background:white;padding:22px;margin:18px 0;border:1px solid #d1d9d3;border-radius:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:560px;overflow:auto;background:#f6f7f5;padding:14px}label{display:block;margin:12px 0}button,select,input,textarea{font:inherit}button{padding:10px 18px;cursor:pointer}textarea{width:100%;min-height:100px;box-sizing:border-box}#notice{white-space:pre-wrap}input[type=checkbox]{margin-right:10px}</style></head><body><main>
<a href="/">← 返回登录 / 工作台</a><h1>训练材料逐项复核</h1>
<p>本批仅含训练案例。机器检查和建议不代表人工通过；请核对每一项后亲自勾选。复核记录为单人非专家意见，不授予正式测试资格。</p>
<p id="notice" role="status">正在读取材料…</p><section><select id="cases" aria-label="训练案例"></select> <button id="open">打开材料</button></section>
<div id="work" hidden><section><h2>原文与来源</h2><pre id="source"></pre></section>
<section><h2>证据、事件与状态支持规则</h2><pre id="case"></pre><details><summary>原五维标注与句子引用</summary><pre id="legacy"></pre></details><details><summary>机器审查建议及运行记录</summary><pre id="audit"></pre></details><details><summary>可达性检查</summary><pre id="solvability"></pre></details></section>
<section><h2>逐项核对</h2><div id="checks"></div><label>核对说明（至少10个字符）<textarea id="notes"></textarea></label><label>实际人工核对分钟数 <input type="number" id="minutes" min="0.1" step="0.1"></label><label><input id="attest" type="checkbox">我本人已核对材料并填写以上记录</label><button id="approve">保存复核通过</button> <button id="reject">保存问题 / 不通过</button></section></div>
<script src="/static/research_v2.js"></script></main></body></html>
