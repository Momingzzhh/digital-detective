<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>五维复核与真人验收</title><style>
body{font:16px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#f6f5f1;color:#25342e;margin:0}main{max-width:1150px;margin:auto;padding:32px}h1,h2{line-height:1.3}a{color:#275e49}button,select,textarea{font:inherit;padding:9px;border:1px solid #aebbb2;border-radius:5px;background:white}button{cursor:pointer;background:#275e49;color:white}button.secondary{background:white;color:#275e49}section{background:white;border:1px solid #d9dfd9;border-radius:8px;padding:22px;margin:18px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.7 monospace;max-height:400px;overflow:auto;background:#f6f7f4;padding:14px}textarea{box-sizing:border-box;width:100%;min-height:85px}label{display:block;margin:8px 0}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.muted{color:#66766b}#notice{white-space:pre-wrap}#work[hidden]{display:none}.evidence{border-top:1px solid #ddd;padding-top:10px}input[type=checkbox]{margin-right:10px}button:disabled{opacity:.5;cursor:wait}
</style></head><body><main><a href="/">← 返回案件工作台</a><h1>五维标注复核与真人验收</h1><p class="muted">此页面面向已授权的本机研究人员。复核区会显示隐藏答案；模型分析只接收你释放的原始证据。不能用此页面的机器标注数量代替人工验收。</p><p id="notice">正在读取本地状态…</p>
<section><div class="toolbar"><label>集合 <select id="split"><option value="dev">验证集</option><option value="test">测试集</option><option value="train">训练集复核</option></select></label><select id="cases" aria-label="选择案例"></select><button id="open">打开复核材料</button></div></section>
<div id="work" hidden><section><h2>原始来源与五维标注</h2><details><summary>查看原始文书</summary><pre id="source"></pre></details><details><summary>查看隐藏结局和五维标注</summary><pre id="annotation"></pre></details><div id="checks"></div><label>核验说明<textarea id="review-notes" placeholder="记录核对的原文位置、发现的问题或通过依据，至少10个字符"></textarea></label><div class="toolbar"><button id="approve">确认人工复核通过</button><button class="secondary" id="reject">记录不通过</button></div></section>
<section><h2>真人交互验收</h2><p>通过复核、完成正式权重训练后可启动。起始仅向Agent提供两条线索；其余材料由研究人员按问题选择释放。每案最多12轮分析。测试集须在完整验证集通过后开启。</p><div class="toolbar"><button id="start">启动 / 继续本案验收</button><button id="analyze">运行一轮分析</button><button id="release">提供选中的原始证据</button></div><div id="evidence"></div><h3>模型当前输出</h3><pre id="prediction">尚未启动会话</pre><div id="rounds"></div><label><input id="chronology" type="checkbox">还原经过完整覆盖所有关键事实，主体、时间和动作均正确</label><label><input id="unsupported" type="checkbox">没有新增无证据支持的经过</label><label>评分说明<textarea id="score-notes" placeholder="记录关键事实核对依据及失败原因，至少10个字符"></textarea></label><button id="score">结束本案并保存人工评分</button><p class="muted">罪名及人物集合由程序比对，经过由研究人员核对。未完成、拒答、超时和失败均保留在完整集合分母中。</p></section></div>
<script src="/static/research.js"></script></main></body></html>
